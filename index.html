<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NEXORA Voice Studio</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10}
    *{box-sizing:border-box}
    #nxApp{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080a10}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#080a10;color:#fff;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;z-index:2}
    .box{text-align:center}
    .logo{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,#8b5cf6,#5b21b6);
      display:grid;place-items:center;margin:0 auto 13px;font-weight:900;font-size:21px;letter-spacing:-2px}
    .muted{color:#98a2b3;font-size:12px;margin-top:7px}
    #err{display:none;max-width:520px;padding:16px;border:1px solid #5b2430;background:#281218;
      border-radius:12px;color:#ff9da8;line-height:1.45}
  </style>
</head>
<body>
  <div id="loading">
    <div class="box">
      <div class="logo">NX</div>
      <b>NEXORA</b>
      <div class="muted">VOICE STUDIO</div>
      <div id="err"></div>
    </div>
  </div>

  <iframe id="nxApp" title="NEXORA Voice Studio"
    allow="autoplay; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script src="config.js"></script>
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(k)) ||
          (e.ctrlKey && ['u','s'].includes(k))) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    const url = String((window.NEXORA_CONFIG && window.NEXORA_CONFIG.backendUrl) || '')
      .trim().replace(/\/$/, '');

    const frame = document.getElementById('nxApp');
    const loading = document.getElementById('loading');
    const err = document.getElementById('err');

    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) {
      err.style.display = 'block';
      err.textContent = 'NEXORA todavía no está conectado. Revisa config.js.';
    } else {
      frame.src = url;
      frame.addEventListener('load', () => {
        setTimeout(() => { loading.style.display = 'none'; }, 250);
      });
      setTimeout(() => {
        if (loading.style.display !== 'none') {
          err.style.display = 'block';
          err.textContent = 'El servicio está tardando en cargar. Actualiza la página en unos segundos.';
        }
      }, 15000);
    }
  </script>
</body>
</html>
