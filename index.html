<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>NEXORA</title><style>
:root{--bg:#080a10;--p:#11151f;--p2:#161b27;--l:#252c3a;--t:#f6f7fb;--m:#99a2b3;--a:#8b5cf6;--bad:#ff6577}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#151229,#080a10 38%);color:var(--t);font-family:Inter,system-ui,Segoe UI,Arial}button,input,textarea,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.lc{width:min(420px,100%);background:#0e121b;border:1px solid var(--l);border-radius:20px;padding:28px}.logo{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,#8b5cf6,#5b21b6);display:grid;place-items:center;margin:auto;font-weight:900;font-size:22px;letter-spacing:-3px}.lc h2{text-align:center;margin:12px 0 3px}.lc>p{text-align:center;color:var(--m);font-size:12px;margin:0 0 24px}.label{font-size:11px;color:var(--m);display:block;margin-bottom:6px}.field{margin-bottom:12px}input,textarea,select{width:100%;background:#090c13;border:1px solid #2a3140;border-radius:11px;padding:11px;color:#fff;outline:none}textarea{min-height:240px;resize:vertical;line-height:1.5}.btn{border:1px solid var(--l);background:#171c28;color:#fff;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#7c3aed,#9333ea);border-color:#a855f7}.btn.bad{color:#ff9aa5;background:#2a1218}.btn.sm{font-size:11px;padding:7px 9px}.err{background:#35141b;border:1px solid #63202e;color:#ff9aa5;padding:9px 11px;border-radius:10px;font-size:12px;margin-top:10px}.shell{min-height:100vh;display:flex}.side{width:225px;position:fixed;inset:0 auto 0 0;border-right:1px solid var(--l);background:#090c11;padding:18px 12px}.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 20px}.brand .logo{width:38px;height:38px;margin:0;font-size:15px}.brand b{font-size:17px}.brand small{display:block;color:var(--m);font-size:9px;letter-spacing:1.2px}.nav button{width:100%;border:0;background:transparent;color:var(--m);padding:11px 12px;border-radius:10px;text-align:left;margin:2px 0}.nav button.active,.nav button:hover{background:#8b5cf617;color:#fff}.sf{position:absolute;bottom:14px;left:12px;right:12px;padding:10px;background:#11151f;border:1px solid var(--l);border-radius:11px;font-size:11px;color:var(--m)}.main{margin-left:225px;width:calc(100% - 225px);padding:24px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:23px}.top p{margin:4px 0 0;color:var(--m);font-size:12px}.badge{font-size:11px;border:1px solid var(--l);padding:7px 10px;border-radius:999px;color:var(--m)}.card{background:linear-gradient(180deg,#131824,#0f131d);border:1px solid var(--l);border-radius:16px;padding:17px}.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:15px}.row{display:flex;gap:9px}.row>*{flex:1}.sec{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sec h2{font-size:16px;margin:0}.tag{font-size:10px;color:#c4b5fd;background:#8b5cf617;border:1px solid #8b5cf62e;padding:4px 7px;border-radius:999px}.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px}.voice{border:1px solid var(--l);background:#0c1018;border-radius:12px;padding:11px;display:flex;align-items:center;gap:9px}.vi{width:34px;height:34px;border-radius:50%;background:#8b5cf61c;display:grid;place-items:center}.vm{min-width:0;flex:1}.vm b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vm small{color:var(--m);font-size:10px}.acts{display:flex;gap:4px}.ic{width:29px;height:29px;border:1px solid var(--l);background:#151a24;color:#fff;border-radius:8px;cursor:pointer}.res{margin-top:12px;background:#090c13;border:1px solid var(--l);border-radius:12px;padding:12px}audio{width:100%;height:40px}.hist{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--l)}.muted{color:var(--m)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:1px solid var(--l);background:#0c1018;border-radius:12px;padding:14px}.stat b{font-size:20px}.stat small{display:block;color:var(--m);margin-top:4px}.toast{position:fixed;right:18px;bottom:18px;max-width:340px;background:#151a24;border:1px solid #303849;border-radius:11px;padding:11px 13px;z-index:20}.consent{display:flex;gap:8px;color:var(--m);font-size:11px}.consent input{width:auto}.cloneText{min-height:100px}@media(max-width:800px){.side{width:65px}.brand>div:last-child,.nav span,.sf{display:none}.brand{justify-content:center}.nav button{text-align:center;padding:11px 4px}.main{margin-left:65px;width:calc(100% - 65px);padding:14px}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style></head><body>
<iframe id="nxBridge" title="NEXORA service" style="display:none;width:0;height:0;border:0" aria-hidden="true"></iframe>
<div id="login" class="login"><div class="lc"><div class="logo">NX</div><h2>NEXORA</h2><p>VOICE STUDIO</p><div class="field"><label class="label">ID DE USUARIO</label><input id="uid" placeholder="NX-1001"></div><div class="field"><label class="label">CLAVE</label><input id="upw" type="password" placeholder="••••••••••••"></div><button id="loginBtn" class="btn primary" style="width:100%">INICIAR SESIÓN</button><div id="le" class="err hidden"></div></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><div class="logo">NX</div><div><b>NEXORA</b><small>VOICE STUDIO</small></div></div><div class="nav"><button class="active" data-v="studio">🎙️ <span>Estudio</span></button><button data-v="voices">🎚️ <span>Voces</span></button><button data-v="clone">🧬 <span>Clonar voz</span></button><button data-v="history">🕘 <span>Historial</span></button><button data-v="account">👤 <span>Mi cuenta</span></button></div><div class="sf"><div id="sid">—</div><div id="sexp">—</div></div></aside><main class="main"><div class="top"><div><h1 id="title">Estudio</h1><p id="sub">Genera audio con tus voces.</p></div><div id="ver" class="badge">NEXORA WEB 1.1</div></div>
<section id="v-studio" class="view"><div class="grid2"><div class="card"><label class="label">TEXTO</label><textarea id="text" maxlength="5000" placeholder="Escribe aquí..."></textarea><div class="row" style="margin-top:9px"><select id="voice"></select><select id="speed"><option>.85</option><option selected>1</option><option>1.1</option><option>1.2</option></select></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><small class="muted"><span id="cc">0</span>/5000</small><button id="gen" class="btn primary">GENERAR AUDIO</button></div><div id="result" class="res hidden"><audio id="audio" controls></audio><button id="down" class="btn" style="width:100%;margin-top:7px">⬇ DESCARGAR MP3</button></div></div><div class="card"><div class="sec"><h2>Voces disponibles</h2><span id="vc" class="tag">0 voces</span></div><div id="sv" class="voices"></div></div></div></section>
<section id="v-voices" class="view hidden"><div class="card" style="margin-bottom:14px"><div class="sec"><h2>Agregar voz por ID</h2><span class="tag">Personal</span></div><div class="row"><input id="vn" placeholder="Nombre"><input id="vid" placeholder="ID de la voz"><button id="addv" class="btn primary" style="flex:0 0 auto">AGREGAR</button></div></div><div class="card"><div class="sec"><h2>Mis voces</h2><button id="restore" class="btn sm">Restaurar predeterminadas</button></div><div id="av" class="voices"></div></div></section>
<section id="v-clone" class="view hidden"><div class="grid2"><div class="card"><div class="sec"><h2>Crear clon guardado</h2><span class="tag">Persistente</span></div><div class="field"><label class="label">NOMBRE</label><input id="cn" placeholder="Narrador Personal"></div><div class="field"><label class="label">AUDIO WAV / MP3 / FLAC</label><input id="cf" type="file" accept=".wav,.mp3,.flac,audio/wav,audio/mpeg,audio/flac"></div><div class="field"><label class="label">TEXTO DEL AUDIO (opcional)</label><textarea id="ct" class="cloneText"></textarea></div><label class="consent"><input id="cons" type="checkbox"><span>Confirmo que tengo autorización para utilizar esta voz.</span></label><button id="clone" class="btn primary" style="width:100%;margin-top:12px">CLONAR Y GUARDAR</button></div><div class="card"><div class="sec"><h2>Mis clones</h2></div><div id="clones" class="voices"></div></div></div></section>
<section id="v-history" class="view hidden"><div class="card"><div class="sec"><h2>Historial</h2><button id="clearh" class="btn sm bad">Vaciar historial</button></div><div id="hl"></div></div></section>
<section id="v-account" class="view hidden"><div class="card"><div class="sec"><h2>Mi cuenta</h2><button id="out" class="btn sm">Cerrar sesión</button></div><div class="stats"><div class="stat"><b id="aid">—</b><small>ID</small></div><div class="stat"><b id="aexp">—</b><small>Acceso hasta</small></div><div class="stat"><b id="ause">0</b><small>Generaciones este mes</small></div></div></div></section>
</main></div><div id="toast" class="toast hidden"></div>
<script src="config.js"></script>
<script>
const S={token:localStorage.getItem('nx_session')||'',device:localStorage.getItem('nx_device')||'',voices:[],history:[],profile:null,active:'',url:'',file:''};
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))||(e.ctrlKey&&['u','s'].includes(k))){e.preventDefault();e.stopPropagation()}},true);
if(!S.device){let a=new Uint8Array(24);crypto.getRandomValues(a);S.device=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('nx_device',S.device)}
const NX_BACKEND=String((window.NEXORA_CONFIG&&window.NEXORA_CONFIG.backendUrl)||'').trim().replace(/\/$/,'');
const NX_BRIDGE=document.getElementById('nxBridge');let NX_READY=false,NX_SEQ=0,NX_BRIDGE_ERROR='',NX_WAIT=[];const NX_PENDING=new Map();
function initBridge(){if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(NX_BACKEND)){NX_BRIDGE_ERROR='Falta configurar backendUrl en config.js';return;}NX_BRIDGE.src=NX_BACKEND+'?bridge=1';}
window.addEventListener('message',e=>{if(e.source!==NX_BRIDGE.contentWindow)return;const m=e.data||{};if(m.nx==='NEXORA_BRIDGE_READY'){NX_READY=true;NX_WAIT.splice(0).forEach(x=>x.ok());return;}if(m.nx==='NEXORA_BRIDGE_RESPONSE'&&m.id){const p=NX_PENDING.get(m.id);if(!p)return;NX_PENDING.delete(m.id);clearTimeout(p.timer);m.ok?p.ok(m.value):p.bad(new Error((m.value&&m.value.message)||'Error del servidor.'));}});
function waitBridge(){return new Promise((ok,bad)=>{if(NX_READY)return ok();if(NX_BRIDGE_ERROR)return bad(new Error(NX_BRIDGE_ERROR));const x={ok,bad};NX_WAIT.push(x);setTimeout(()=>{const i=NX_WAIT.indexOf(x);if(i>=0){NX_WAIT.splice(i,1);bad(new Error('No se pudo conectar con NEXORA. Verifica config.js y el frontend autorizado en ADMIN.'));}},15000);});}
function call(f,...a){return waitBridge().then(()=>new Promise((ok,bad)=>{const id='nx_'+Date.now()+'_'+(++NX_SEQ);const timer=setTimeout(()=>{NX_PENDING.delete(id);bad(new Error('La operación tardó demasiado. Inténtalo nuevamente.'));},120000);NX_PENDING.set(id,{ok,bad,timer});NX_BRIDGE.contentWindow.postMessage({nx:'NEXORA_BRIDGE_REQUEST',id:id,fn:f,args:a},'*');}));}
initBridge();function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3000)}function busy(b,on,t){if(on){b.dataset.o=b.textContent;b.disabled=true;b.textContent=t||'...'}else{b.disabled=false;b.textContent=b.dataset.o||b.textContent}}
function showLogin(){login.classList.remove('hidden');app.classList.add('hidden')}function showApp(){login.classList.add('hidden');app.classList.remove('hidden')}
loginBtn.onclick=async()=>{busy(loginBtn,true,'ENTRANDO...');le.classList.add('hidden');try{let r=await call('login',uid.value,upw.value,S.device);S.token=r.token;localStorage.setItem('nx_session',S.token);await refresh();showApp();upw.value=''}catch(e){le.textContent=e.message;le.classList.remove('hidden')}finally{busy(loginBtn,false)}};upw.onkeydown=e=>{if(e.key==='Enter')loginBtn.click()};
async function refresh(){let b=await call('getBootstrap',S.token,S.device);S.voices=b.voices||[];S.history=b.history||[];S.profile=b.profile;S.active=b.activeVoiceKey||'';ver.textContent='NEXORA '+b.version;render()}
function render(){sid.textContent=S.profile.id;sexp.textContent='Vence: '+S.profile.expiresAt;aid.textContent=S.profile.id;aexp.textContent=S.profile.expiresAt;ause.textContent=S.profile.usage.monthGenerations||0;voice.innerHTML=S.voices.map(v=>`<option value="${esc(v.key)}">${esc(v.name)}</option>`).join('');if(S.voices.some(v=>v.key===S.active))voice.value=S.active;vc.textContent=S.voices.length+' voces';sv.innerHTML=S.voices.slice(0,12).map(v=>card(v,true)).join('')||'<p class="muted">No hay voces.</p>';av.innerHTML=S.voices.map(v=>card(v,false)).join('')||'<p class="muted">No hay voces.</p>';clones.innerHTML=S.voices.filter(v=>v.type==='clone').map(v=>card(v,false)).join('')||'<p class="muted">Todavía no tienes clones.</p>';renderHist()}
function card(v,mini){let ren=v.type!=='default';return`<div class="voice"><div class="vi">🎙</div><div class="vm"><b>${esc(v.name)}</b><small>${v.type==='clone'?'Clon':v.type==='custom'?'Personal':'Predeterminada'}</small></div><div class="acts"><button class="ic" onclick="useVoice('${v.key}')">✓</button>${mini?'':ren?`<button class="ic" onclick="renameV('${v.key}','${esc(v.name)}')">✎</button>`:''}${mini?'':`<button class="ic" onclick="${v.type==='default'?'hideV':'delV'}('${v.key}')">×</button>`}</div></div>`}
async function useVoice(k){try{await call('setActiveVoice',S.token,S.device,k);S.active=k;voice.value=k;view('studio');toast('Voz seleccionada.')}catch(e){toast(e.message)}}voice.onchange=()=>useVoice(voice.value);
addv.onclick=async()=>{busy(addv,true,'AGREGANDO...');try{await call('addVoiceById',S.token,S.device,vn.value,vid.value);vn.value='';vid.value='';await refresh();toast('Voz agregada.')}catch(e){toast(e.message)}finally{busy(addv,false)}};
async function renameV(k,n){let x=prompt('Nuevo nombre:',n);if(!x)return;try{await call('renameVoice',S.token,S.device,k,x);await refresh()}catch(e){toast(e.message)}}async function delV(k){if(!confirm('¿Eliminar esta voz?'))return;try{await call('deleteUserVoice',S.token,S.device,k);await refresh()}catch(e){toast(e.message)}}async function hideV(k){if(!confirm('¿Ocultar esta voz?'))return;try{await call('hideDefaultVoice',S.token,S.device,k);await refresh()}catch(e){toast(e.message)}}restore.onclick=async()=>{try{await call('restoreDefaultVoices',S.token,S.device);await refresh()}catch(e){toast(e.message)}};
text.oninput=()=>cc.textContent=text.value.length;gen.onclick=async()=>{busy(gen,true,'GENERANDO...');try{let r=await call('generateAudio',S.token,S.device,voice.value,text.value,{speed:Number(speed.value)});setAudio(r.audioBase64,r.mimeType,r.filename);S.history=r.history||[];S.profile.usage=r.usage;render();toast('Audio generado.')}catch(e){toast(e.message)}finally{busy(gen,false)}};
function setAudio(b,m,n){if(S.url)URL.revokeObjectURL(S.url);let by=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),bl=new Blob([by],{type:m||'audio/mpeg'});S.url=URL.createObjectURL(bl);S.file=n||'NEXORA_audio.mp3';audio.src=S.url;result.classList.remove('hidden')}down.onclick=()=>{if(!S.url)return;let a=document.createElement('a');a.href=S.url;a.download=S.file;a.click()};
clone.onclick=async()=>{let f=cf.files[0];if(!f)return toast('Selecciona un audio.');if(f.size>8*1024*1024)return toast('El audio supera 8 MB.');if(!cons.checked)return toast('Confirma la autorización de uso.');busy(clone,true,'CLONANDO...');try{let b=await new Promise((ok,bad)=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=bad;r.readAsDataURL(f)});await call('createSavedClone',S.token,S.device,{name:cn.value,transcript:ct.value,fileName:f.name,mimeType:f.type||'audio/wav',base64:b,consent:true});cn.value='';ct.value='';cf.value='';cons.checked=false;await refresh();toast('Clon guardado.')}catch(e){toast(e.message)}finally{busy(clone,false)}};
function renderHist(){hl.innerHTML=S.history.length?S.history.map(h=>`<div class="hist"><div><b>${esc(h.voiceName)}</b><div class="muted" style="font-size:11px;margin:4px 0">${esc(h.textPreview)}</div><small class="muted">${new Date(h.createdAt).toLocaleString()}</small></div><div><button class="btn sm" onclick="playH('${h.id}')">▶ / ⬇</button> <button class="btn sm bad" onclick="delH('${h.id}')">×</button></div></div>`).join(''):'<p class="muted">Todavía no hay audios.</p>'}async function playH(id){try{let r=await call('getHistoryAudio',S.token,S.device,id);setAudio(r.audioBase64,r.mimeType,r.filename);view('studio');audio.play().catch(()=>{})}catch(e){toast(e.message)}}async function delH(id){if(!confirm('¿Eliminar este audio?'))return;try{let r=await call('deleteHistoryItem',S.token,S.device,id);S.history=r.history;renderHist()}catch(e){toast(e.message)}}clearh.onclick=async()=>{if(!confirm('¿Vaciar todo el historial?'))return;try{let r=await call('clearHistory',S.token,S.device);S.history=r.history;renderHist()}catch(e){toast(e.message)}};
out.onclick=async()=>{try{await call('logout',S.token,S.device)}catch(e){}localStorage.removeItem('nx_session');location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));function view(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));document.querySelectorAll('.view').forEach(e=>e.classList.add('hidden'));document.getElementById('v-'+v).classList.remove('hidden');let m={studio:['Estudio','Genera audio con tus voces.'],voices:['Voces','Administra las voces de tu cuenta.'],clone:['Clonar voz','Crea y guarda voces reutilizables.'],history:['Historial','Tus últimos audios.'],account:['Mi cuenta','Estado de tu acceso.']};title.textContent=m[v][0];sub.textContent=m[v][1]}
(async()=>{if(!S.token)return showLogin();try{await refresh();showApp()}catch(e){localStorage.removeItem('nx_session');S.token='';showLogin()}})();
</script></body></html>
